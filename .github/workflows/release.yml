name: Semantic release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      (contains(toJSON(github.event.pull_request.labels.*.name), 'breaking') ||
       contains(toJSON(github.event.pull_request.labels.*.name), 'feature') ||
       contains(toJSON(github.event.pull_request.labels.*.name), 'fix'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install python-semantic-release
      - name: Apply PR label to release commit
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          label=$(python -c 'import json,os; labels=json.loads(os.environ["LABELS"]); print(next((x for x in ("breaking", "feature", "fix") if x in labels), ""))')
          case "$label" in
            breaking) prefix='feat!:' ;;
            feature) prefix='feat:' ;;
            fix) prefix='fix:' ;;
            *) exit 0 ;;
          esac
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit --allow-empty -m "$prefix $PR_TITLE"
          git push origin main
      - uses: python-semantic-release/python-semantic-release@v9.21.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
