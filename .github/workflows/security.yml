name: Container security scan

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trivy:
    name: Build and scan backend image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target runtime --tag neuroflow-api:task15-prod --file backend/Dockerfile .

      - name: Install Trivy and fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: neuroflow-api:task15-prod
          scan-type: image
          severity: CRITICAL
          exit-code: "1"
