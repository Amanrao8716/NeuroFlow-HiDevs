name: Scheduled staging retrieval quality gate

on:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    environment: staging
    env:
      POSTGRES_HOST: ${{ secrets.STAGING_POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.STAGING_POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.STAGING_POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.STAGING_POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
      REDIS_HOST: ${{ secrets.STAGING_REDIS_HOST }}
      REDIS_PORT: ${{ secrets.STAGING_REDIS_PORT }}
      REDIS_PASSWORD: ${{ secrets.STAGING_REDIS_PASSWORD }}
      MLFLOW_TRACKING_URI: ${{ secrets.STAGING_MLFLOW_TRACKING_URI }}
      NEUROFLOW_PIPELINE_ID: ${{ secrets.STAGING_PIPELINE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Run retrieval evaluation
        run: python evaluation/retrieval_eval.py --env staging
      - name: Enforce minimum MRR
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          results = json.loads(Path("evaluation/retrieval_results.json").read_text())
          if results.get("status") != "completed":
              raise SystemExit(f"Retrieval evaluation did not complete: {results.get('status')}")
          mrr = results.get("cross_encoder_reranked", {}).get("mrr_at_10")
          if not isinstance(mrr, (int, float)) or mrr < 0.55:
              raise SystemExit(f"Retrieval MRR {mrr!r} is below the required 0.55")
          print(f"Retrieval MRR passed: {mrr:.4f}")
          PY
      - name: Notify Slack on failure
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v2.1.1
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "NeuroFlow staging retrieval quality gate failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
