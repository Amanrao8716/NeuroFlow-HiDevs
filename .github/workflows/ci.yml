name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install lint tools
        run: python -m pip install ruff mypy
      - name: Ruff
        run: ruff check backend/
      - name: Mypy
        run: mypy backend/ pipelines/ evaluation/ --ignore-missing-imports --exclude '(^|/)tests/'
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: testpassword  # pragma: allowlist secret
          POSTGRES_DB: neuroflow_test
        options: >-
          --health-cmd "pg_isready -U postgres -d neuroflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: neuroflow_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword  # pragma: allowlist secret
      REDIS_HOST: localhost
      REDIS_PASSWORD: ""
      NEUROFLOW_JWT_SECRET: unit-test-signing-key-at-least-32-characters  # pragma: allowlist secret
      NEUROFLOW_AUTH_CLIENTS: "{}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements.txt pytest pytest-cov
      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=backend --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install security tools
        run: python -m pip install detect-secrets pip-audit
      - name: Scan changed files for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if [ -n "$changed_files" ]; then
            # The repository paths are ordinary tracked source paths.
            detect-secrets-hook --baseline .secrets.baseline $changed_files
          fi
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high
