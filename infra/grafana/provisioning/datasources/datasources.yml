apiVersion: 1

datasources:
  - name: Prometheus
    uid: neuroflow-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: NeuroFlow PostgreSQL
    uid: neuroflow-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    database: neuroflow
    basicAuth: false
    isDefault: false
    editable: false
    jsonData:
      postgresVersion: 1600
      sslmode: disable
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
